<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aayush Filing Helper</title>
  <style>
    :root {
      --brand: #1d4ed8;
      --brand-dark: #1e40af;
      --brand-soft: #eef2ff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #ffffff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --error: #b91c1c;
      --error-soft: #fef2f2;
      --warning: #b45309;
      --warning-soft: #fffbeb;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      line-height: 1.3;
    }

    header p {
      font-size: 11.5px;
      color: var(--muted);
      margin: 1px 0 0;
    }

    #app {
      padding: 16px;
      font-size: 13.5px;
    }

    h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 600;
    }

    label.field {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--ink);
      background: #fff;
    }

    input[type="email"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--brand-dark); }
    button:active { transform: translateY(1px); }

    #code-step { margin-top: 10px; }

    .case-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
    }

    .case-row:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .case-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .case-row input[type="radio"] {
      accent-color: var(--brand);
      margin: 0;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 20px 8px;
      font-size: 13px;
    }

    #status {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
    }

    #status.status-info { color: var(--brand-dark); background: var(--brand-soft); }
    #status.status-success { color: var(--success); background: var(--success-soft); }
    #status.status-warning { color: var(--warning); background: var(--warning-soft); }
    #status.status-error { color: var(--error); background: var(--error-soft); }
  </style>
</head>
<body>
  <header>
    <div class="mark">A</div>
    <div>
      <h1>Aayush Filing</h1>
      <p>Hospital autofill helper</p>
    </div>
  </header>
  <div id="app">Loading&hellip;</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
